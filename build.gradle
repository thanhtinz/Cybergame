buildscript {
    repositories {
        if (rootProject.file('local-maven').isDirectory()) {
            maven { url rootProject.file('local-maven') }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}
allprojects {
    version = '0.1.0'
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    ext {
        gdxVersion = '1.14.0'
        appName = 'AvatarDK'
    }
    repositories {
        // Kho Maven cuc bo offline (copy tu du an TFT cua chu du an) — uu tien so 1
        if (rootProject.file('local-maven').isDirectory()) {
            maven { url rootProject.file('local-maven') }
        }
        mavenCentral()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}
