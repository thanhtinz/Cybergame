plugins { id 'java' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets.main.resources.srcDirs = ['../assets']
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}
tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.DesktopLauncher'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    standardInput = System.in
}
tasks.register('checkFonts', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.ui.FontCheckMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.register('bakeFonts', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.ui.BakeFontsMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.register('smoke', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.DataSmokeMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.register('shot', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.ScreenshotMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
}
tasks.register('tour', JavaExec) {
    dependsOn classes
    mainClass = 'com.avatardk.game.ScreenshotMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    args 'tour'
}
jar { archiveFileName = 'avatardk-desktop.jar' }

// Bản phát hành chơi thử GỌN: gộp hết thư viện vào 1 jar chạy thẳng,
// KHÔNG nhúng dữ liệu game — chỉ đóng sẵn fonts + banner.jpg để hiện
// được màn hình tải dữ liệu ở lần mở đầu tiên (phần data còn lại client
// tự tải từ GitHub Release gamedata-v1, xem DataUpdater).
tasks.register('slimJar', Jar) {
    archiveFileName = 'ThiTranMatTroi.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.avatardk.game.DesktopLauncher' }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    from(sourceSets.main.output.classesDirs)
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } })
    from('../assets') { include 'banner.jpg'; include 'fonts/**' }
}

